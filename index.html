<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AluraBooks</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Poppins:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="./src/styles/main.scss" />
    </head>

    <body>
        <header class="header">
            <div class="header__container">
                <div class="header__brand">
                    <button
                        class="header__menu-toggle"
                        type="button"
                        aria-label="Open navigation menu"
                        aria-expanded="false"
                    >
                        <img
                            src="/assets/icons/menu.svg"
                            alt="Hamburger menu icon"
                            class="header__icon"
                        />
                    </button>
                    <a href="/" class="header__logo-link">
                        <img
                            src="/assets/logos/logo.svg"
                            alt="AluraBooks Logo"
                            class="header__logo-icon"
                        />

                        <span class="header__wordmark">
                            <span class="header__wordmark-alura">Alura</span
                            ><span class="header__wordmark-books">Books</span>
                        </span>
                    </a>
                </div>

                <nav class="header__nav" aria-label="Primary navigation">
                    <div class="header__nav-item">
                        <button
                            class="header__nav-link header__categories-trigger"
                            aria-haspopup="true"
                            aria-expanded="false"
                            type="button"
                        >
                            Categories
                        </button>
                        <div
                            id="categories-dropdown"
                            class="header__categories-dropdown"
                            hidden
                        >
                            <ul class="header__categories-list">
                                <li>
                                    <a
                                        href="/category/programming"
                                        class="header__categories-link"
                                        >Programming</a
                                    >
                                </li>
                                <li>
                                    <a
                                        href="/category/front-end"
                                        class="header__categories-link"
                                        >Front-End</a
                                    >
                                </li>
                                <li>
                                    <a
                                        href="/category/infrastructure"
                                        class="header__categories-link"
                                        >Infrastructure</a
                                    >
                                </li>
                                <li>
                                    <a
                                        href="/category/business"
                                        class="header__categories-link"
                                        >Business</a
                                    >
                                </li>
                                <li>
                                    <a
                                        href="/category/design-ux"
                                        class="header__categories-link"
                                        >Design &amp; UX</a
                                    >
                                </li>
                            </ul>
                        </div>
                    </div>
                    <a href="/favorites" class="header__nav-link">Favorites</a>
                    <a href="/bookshelf" class="header__nav-link"
                        >My Bookshelf</a
                    >
                </nav>

                <nav class="header__actions" aria-label="User utilities">
                    <a
                        href="/favorites"
                        class="header__action-link header__action-link--favorites"
                    >
                        <img
                            src="/assets/icons/favoritos.svg"
                            alt="Favorites icon"
                            class="header__favorites-icon"
                        />
                    </a>

                    <a
                        href="/bag"
                        class="header__action-link header__action-link--bag"
                    >
                        <img
                            src="/assets/icons/sacola.svg"
                            alt="Shopping bag icon"
                            class="header__bag-icon"
                        />
                        <span>My Bag</span>
                    </a>

                    <a href="/profile" class="header__action-link">
                        <img
                            src="/assets/icons/usuario.svg"
                            alt="User profile icon"
                            class="header__user-icon"
                        />
                        <span>My Profile</span>
                    </a>
                </nav>
            </div>

            <div class="header__dropdown" id="headerDropdown" hidden>
                <p class="header__dropdown-title">Categories</p>
                <nav class="header__dropdown-nav" aria-label="Book categories">
                    <a
                        href="/category/programming"
                        class="header__dropdown-link"
                        >Programming</a
                    >
                    <a href="/category/front-end" class="header__dropdown-link"
                        >Front-End</a
                    >
                    <a
                        href="/category/infrastructure"
                        class="header__dropdown-link"
                        >Infrastructure</a
                    >
                    <a href="/category/business" class="header__dropdown-link"
                        >Business</a
                    >
                    <a href="/category/design-ux" class="header__dropdown-link"
                        >Design &amp; UX</a
                    >
                </nav>
            </div>
        </header>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
